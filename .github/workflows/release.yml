name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
      - run: nix build .#dognerd
      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(jq -r .version manifest.json)
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || {
            echo "::error::tag $GITHUB_REF_NAME doesn't match manifest version $version"
            exit 1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: dognerd
          path: result/dognerd.xpi

  publish-firefox:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix shell nixpkgs#web-ext --command web-ext sign --source-dir . --channel listed --approval-timeout 0
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

  publish-chrome:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dognerd
      - run: mv dognerd.xpi dognerd.zip
      - run: npx -y chrome-webstore-upload-cli@4.0.2 --source dognerd.zip
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
